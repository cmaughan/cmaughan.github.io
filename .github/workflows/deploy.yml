name: Deploy site

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build Quarto projects
        shell: bash
        run: |
          set -euo pipefail
          for project in quarto/*/; do
            if [ ! -f "${project}_quarto.yml" ]; then
              continue
            fi

            name="$(basename "$project")"
            quarto render "$project"
            mkdir -p "static/presentations/$name"
            cp -a "${project}_output/." "static/presentations/$name/"
          done

      - name: Build site
        run: hugo --minify --destination public

      - name: Preserve custom domain
        run: cp CNAME public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
