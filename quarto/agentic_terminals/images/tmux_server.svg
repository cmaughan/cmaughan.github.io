<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="tmux server owns panes and their processes independently of attached terminal clients"><title>tmux server owns panes and their processes independently of attached terminal clients</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="290" y="30" width="425" height="350" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="311" y="70" font-size="33" fill="#7ee787" text-anchor="start" font-weight="600">tmux server</text><text x="311" y="108" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="400">Session → windows → panes</text><rect x="314" y="145" width="169" height="100" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="332" y="180" font-size="26" fill="#7ee787" text-anchor="start" font-weight="600">Pane 1</text><text x="332" y="212" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">PTY + shell</text><rect x="515" y="145" width="175" height="100" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="533" y="180" font-size="26" fill="#7ee787" text-anchor="start" font-weight="600">Pane 2</text><text x="533" y="212" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">PTY + build</text><text x="315" y="293" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="400">Processes + screen state</text><text x="315" y="334" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Stay alive when a client detaches</text><rect x="7" y="67" width="224" height="114" rx="10" fill="#161e29" stroke="#a4b3c4" stroke-width="2"/><text x="25" y="102" font-size="26" fill="#a4b3c4" text-anchor="start" font-weight="600">Client A</text><text x="25" y="134" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Terminal at work</text><text x="25" y="162.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">detach</text><path d="M238,125 L280,125" fill="none" stroke="#a4b3c4" stroke-width="2.5" marker-end="url(#muted)" stroke-dasharray="6 6"/><rect x="764" y="229" width="224" height="114" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="782" y="264" font-size="26" fill="#58a6ff" text-anchor="start" font-weight="600">Client B</text><text x="782" y="296" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Terminal at home</text><text x="782" y="324.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">reattach</text><path d="M725,286 L755,286" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><text x="10" y="416" font-size="30" fill="#f2b66d" text-anchor="start" font-weight="400">A pane is a terminal.  A client is a view onto it.</text></g></svg>