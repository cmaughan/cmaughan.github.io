<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="A split ANSI color sequence retained across reads, dispatched by a streaming state machine"><title>A split ANSI color sequence retained across reads, dispatched by a streaming state machine</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="10" y="27" font-size="27" fill="#a4b3c4" text-anchor="start" font-weight="400">Reads can end halfway through a command.</text><rect x="10" y="60" width="274" height="73" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="28" y="95" font-size="26" fill="#f2b66d" text-anchor="start" font-weight="600">read #1</text><text x="28" y="127" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">ESC [ 3 1</text><rect x="326" y="60" width="310" height="73" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="344" y="95" font-size="26" fill="#7ee787" text-anchor="start" font-weight="600">read #2</text><text x="344" y="127" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">m H i ESC [ 0 m</text><text x="744" y="74" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Result</text><rect x="744" y="90" width="37" height="42" rx="0" fill="#1c4432" stroke="#7ee787" stroke-width="2"/><text x="762.5" y="121.08" font-size="28.14" fill="#ff8989" text-anchor="middle" font-weight="500">H</text><rect x="781" y="90" width="37" height="42" rx="0" fill="#1c4432" stroke="#7ee787" stroke-width="2"/><text x="799.5" y="121.08" font-size="28.14" fill="#ff8989" text-anchor="middle" font-weight="500">i</text><rect x="818" y="90" width="37" height="42" rx="0" fill="#161e29" stroke="#33465a" stroke-width="2"/><rect x="855" y="90" width="37" height="42" rx="0" fill="#161e29" stroke="#33465a" stroke-width="2"/><rect x="892" y="90" width="37" height="42" rx="0" fill="#161e29" stroke="#33465a" stroke-width="2"/><rect x="929" y="90" width="37" height="42" rx="0" fill="#161e29" stroke="#33465a" stroke-width="2"/><rect x="10" y="214" width="180" height="80" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="28" y="249" font-size="26" fill="#58a6ff" text-anchor="start" font-weight="600">Ground</text><rect x="280" y="214" width="180" height="80" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="298" y="249" font-size="26" fill="#f2b66d" text-anchor="start" font-weight="600">Escape</text><rect x="555" y="214" width="180" height="80" rx="10" fill="#161e29" stroke="#c4a5ff" stroke-width="2"/><text x="573" y="249" font-size="26" fill="#c4a5ff" text-anchor="start" font-weight="600">CSI</text><rect x="814" y="214" width="175" height="80" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="832" y="249" font-size="26" fill="#7ee787" text-anchor="start" font-weight="600">Dispatch</text><path d="M197,246 L271,246" fill="none" stroke="#f2b66d" stroke-width="2.5" marker-end="url(#gold)" /><text x="232" y="228" font-size="21" fill="#f2b66d" text-anchor="middle" font-weight="400">ESC</text><path d="M468,246 L546,246" fill="none" stroke="#c4a5ff" stroke-width="2.5" marker-end="url(#purple)" /><text x="507" y="228" font-size="26" fill="#c4a5ff" text-anchor="middle" font-weight="400">[</text><path d="M740,246 L806,246" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)" /><text x="772" y="227" font-size="24" fill="#7ee787" text-anchor="middle" font-weight="400">m</text><path d="M904,298 V352 H100 V300" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)"/><text x="477" y="342" font-size="23" fill="#7ee787" text-anchor="middle" font-weight="400">Set foreground red → write “Hi” → reset attributes</text><text x="14" y="412" font-size="24" fill="#f2b66d" text-anchor="start" font-weight="400">Retain partial state</text><text x="355" y="412" font-size="24" fill="#f2b66d" text-anchor="start" font-weight="400">Bound buffers</text><text x="659" y="412" font-size="24" fill="#f2b66d" text-anchor="start" font-weight="400">Recover from bad input</text></g></svg>