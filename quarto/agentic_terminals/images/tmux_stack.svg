<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="In normal tmux mode application output is parsed, composed and encoded again before Draxul decodes it"><title>In normal tmux mode application output is parsed, composed and encoded again before Draxul decodes it</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="15" y="31" width="220" height="98" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="33" y="66" font-size="26" fill="#7ee787" text-anchor="start" font-weight="600">Application</text><text x="33" y="98" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Vim / shell / agent</text><path d="M243,82 L342,82" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)" /><text x="292" y="54" font-size="20" fill="#7ee787" text-anchor="middle" font-weight="400">VT bytes</text><rect x="352" y="31" width="280" height="98" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="370" y="66" font-size="26" fill="#f2b66d" text-anchor="start" font-weight="600">tmux pane</text><text x="370" y="98" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Parse → virtual screen</text><path d="M632,81 H747 V149" fill="none" stroke="#f2b66d" stroke-width="2.5" marker-end="url(#gold)"/><rect x="619" y="159" width="365" height="109" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="637" y="194" font-size="26" fill="#f2b66d" text-anchor="start" font-weight="600">tmux layout</text><text x="637" y="226" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Compose panes + status line</text><text x="637" y="254.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Encode for the outer terminal</text><path d="M615,214 H452 V285" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="302" y="296" width="304" height="112" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="320" y="331" font-size="26" fill="#58a6ff" text-anchor="start" font-weight="600">Draxul</text><text x="320" y="363" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Parse → grid → GPU</text><text x="58" y="320" font-size="24" fill="#58a6ff" text-anchor="start" font-weight="400">Another VT stream</text><path d="M193,342 L290,342" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><text x="17" y="172" font-size="20" fill="#7ee787" text-anchor="start" font-weight="600">INSIDE</text><text x="17" y="209" font-size="22" fill="#e6edf3" text-anchor="start" font-weight="400">TERM=tmux-256color</text><text x="17" y="244" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">or screen-256color</text><text x="664" y="325" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="400">Capabilities cross boundaries.</text><text x="664" y="361" font-size="23" fill="#a4b3c4" text-anchor="start" font-weight="400">Colors · keys · clipboard</text><text x="664" y="392.05" font-size="23" fill="#a4b3c4" text-anchor="start" font-weight="400">Extensions need cooperation.</text></g></svg>