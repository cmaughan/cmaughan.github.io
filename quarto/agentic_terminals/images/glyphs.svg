-size="26" fill="#58a6ff" text-anchor="start" font-weight="600">HarfBuzz</text><text x="430" y="212" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Glyph IDs</text><text x="430" y="240.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">+ offsets</text><path d="M596,206 L608,206" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><rect x="613" y="145" width="181" height="125" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="631" y="180" font-size="26" fill="#58a6ff" text-anchor="start" font-weight="600">FreeType</text><text x="631" y="212" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Rasterize</text><text x="631" y="240.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">bitmaps</text><path d="M797,206 L809,206" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><rect x="814" y="145" width="181" height="125" rx="10" fill="#161e29" stroke="#c4a5ff" stroke-width="2"/><text x="832" y="180" font-size="26" fill="#c4a5ff" text-anchor="start" font-weight="600">Atlas</text><text x="832" y="212" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Cache</text><text x="832" y="240.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">texture UVs</text><text x="412" y="314" font-size="25" fill="#58a6ff" text-anchor="start" font-weight="400">Font selection + fallback</text><path d="M410,288 L795,288" fill="none" stroke="#58a6ff" stroke-width="2" /><text x="17" y="364" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">BYTE</text><text x="143" y="364" font-size="32" fill="#f2b66d" text-anchor="start" font-weight="400">≠</text><text x="207" y="364" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">CHARACTER</text><text x="390" y="364" font-size="32" fill="#f2b66d" text-anchor="start" font-weight="400">≠</text><text x="459" y="364" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">GLYPH</text><text x="580" y="364" font-size="32" fill="#f2b66d" text-anchor="start" font-weight="400">≠</text><text x="650" y="364" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">CELL</text><text x="18" y="410" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="400">Emoji, combining marks and ligatures make the differences visible.</text></g></svg>