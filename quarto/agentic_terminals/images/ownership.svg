<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Draxul evolved from one UI-owned runtime to a headless server plus independent GPU clients"><title>Draxul evolved from one UI-owned runtime to a headless server plus independent GPU clients</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="12" y="29" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="600">BEFORE</text><rect x="13" y="58" width="330" height="295" rx="10" fill="#161e29" stroke="#a4b3c4" stroke-width="2"/><text x="35" y="98" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="400">One UI process</text><text x="36" y="152" font-size="27" fill="#a4b3c4" text-anchor="start" font-weight="400">Window + input</text><text x="36" y="188.45" font-size="27" fill="#a4b3c4" text-anchor="start" font-weight="400">Fonts + GPU</text><text x="36" y="224.9" font-size="27" fill="#a4b3c4" text-anchor="start" font-weight="400">VT state + scrollback</text><text x="36" y="261.35" font-size="27" fill="#a4b3c4" text-anchor="start" font-weight="400">PTY + shells</text><path d="M363,209 L442,209" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><text x="406" y="181" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="400">split</text><text x="466" y="29" font-size="21" fill="#7ee787" text-anchor="start" font-weight="600">CURRENT OWNERSHIP</text><rect x="467" y="58" width="242" height="290" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="485" y="93" font-size="26" fill="#7ee787" text-anchor="start" font-weight="600">Server</text><text x="485" y="125" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">PTY + shells</text><text x="485" y="153.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">VT state + history</text><text x="485" y="181.7" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Session topology</text><text x="485" y="210.05" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Agent state</text><text x="485" y="238.4" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Persistence</text><rect x="741" y="58" width="242" height="290" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="759" y="93" font-size="26" fill="#58a6ff" text-anchor="start" font-weight="600">UI client</text><text x="759" y="125" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Window + input</text><text x="759" y="153.35" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Fonts + GPU</text><text x="759" y="181.7" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Local focus</text><text x="759" y="210.05" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Local selection</text><text x="759" y="238.4" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Local viewport</text><path d="M725,56 L725,349" fill="none" stroke="#33465a" stroke-width="2" stroke-dasharray="6 6"/><text x="469" y="389" font-size="30" fill="#7ee787" text-anchor="start" font-weight="400">1 server</text><text x="744" y="389" font-size="30" fill="#58a6ff" text-anchor="start" font-weight="400">1…N clients</text><text x="14" y="416" font-size="27" fill="#f2b66d" text-anchor="start" font-weight="400">Window lifetime ≠ shell lifetime</text></g></svg>