<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Conceptual Herdr interface with persistent spaces, panes and agents showing working, blocked and done states"><title>Conceptual Herdr interface with persistent spaces, panes and agents showing working, blocked and done states</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="13" y="20" width="620" height="340" rx="10" fill="#161e29" stroke="#33465a" stroke-width="2"/><text x="34" y="57" font-size="29" fill="#7ee787" text-anchor="start" font-weight="600">Herdr</text><path d="M34,76 L612,76" fill="none" stroke="#33465a" stroke-width="2" /><path d="M217,78 L217,359" fill="none" stroke="#33465a" stroke-width="2" /><text x="34" y="110" font-size="18" fill="#a4b3c4" text-anchor="start" font-weight="400">SPACES</text><text x="35" y="143" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="400">app</text><text x="35" y="178" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="400">renderer</text><text x="34" y="223" font-size="18" fill="#a4b3c4" text-anchor="start" font-weight="400">AGENTS</text><text x="35" y="257" font-size="22" fill="#7ee787" text-anchor="start" font-weight="400">● working</text><text x="35" y="292" font-size="22" fill="#f2b66d" text-anchor="start" font-weight="400">◆ blocked</text><text x="35" y="327" font-size="22" fill="#58a6ff" text-anchor="start" font-weight="400">✓ done</text><rect x="236" y="96" width="377" height="111" rx="2" fill="#0d1117" stroke="#33465a" stroke-width="2"/><text x="252" y="128" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="400">agent: renderer</text><text x="252" y="164" font-size="21" fill="#f2b66d" text-anchor="start" font-weight="400">Waiting for your decision…</text><rect x="236" y="225" width="377" height="112" rx="2" fill="#0d1117" stroke="#33465a" stroke-width="2"/><text x="252" y="256" font-size="23" fill="#e6edf3" text-anchor="start" font-weight="400">tests</text><text x="252" y="296" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">$ running in another pane</text><text x="673" y="80" font-size="28" fill="#7ee787" text-anchor="start" font-weight="600">Keep it running</text><text x="673" y="118" font-size="23" fill="#a4b3c4" text-anchor="start" font-weight="400">Detach, then return</text><text x="673" y="149.05" font-size="23" fill="#a4b3c4" text-anchor="start" font-weight="400">to the same session.</text><text x="673" y="208" font-size="28" fill="#f2b66d" text-anchor="start" font-weight="600">Find who needs you</text><text x="673" y="247" font-size="23" fill="#a4b3c4" text-anchor="start" font-weight="400">Agent state travels</text><text x="673" y="278.05" font-size="23" fill="#a4b3c4" text-anchor="start" font-weight="400">up to the sidebar.</text><text x="16" y="406" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="400">Agent-aware terminal multiplexer · familiar CLIs · scriptable control</text></g></svg>