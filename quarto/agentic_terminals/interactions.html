<script>
(() => {
  const examples = {
    build: { route: 'Renderer', title: 'Build the app', status: 'Working', color: '#7ee787', output: 'Building the latest changes…\n\nI’ll let you know when it’s ready.' },
    review: { route: 'Protocol', title: 'Review changes', status: 'Needs your decision', color: '#f2b66d', output: 'I found a possible problem.\n\nShall I investigate it?' },
    tests: { route: 'Runtime', title: 'Check reconnect', status: 'Finished', color: '#58a6ff', output: 'The checks passed.\n\nReady for your next task.' },
    new: { route: 'Investigation', title: 'Start a task', status: 'Just created', color: '#c4a5ff', output: 'Starting a new agent…\n\nThe other agents keep working.' }
  };
  document.querySelectorAll('[data-agent]').forEach(button => {
    button.addEventListener('click', () => {
      const example = examples[button.dataset.agent];
      document.querySelectorAll('[data-agent]').forEach(row => {
        const selected = row === button;
        row.classList.toggle('active', selected);
        row.setAttribute('aria-pressed', String(selected));
      });
      document.getElementById('agent-route').textContent = example.route;
      document.getElementById('agent-title').textContent = example.title;
      document.getElementById('agent-status').textContent = example.status;
      document.getElementById('agent-status').style.color = example.color;
      document.getElementById('agent-output').textContent = example.output;
    });
  });
})();
</script>
