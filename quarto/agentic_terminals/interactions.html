<script>
(() => {
  const examples = {
    otter: { route: 'Draxul › parser › pane 1', status: '● Working', color: '#7ee787', output: 'Splitting the CSI tests into smaller cases…\n\nEdited 3 files.' },
    heron: { route: 'Draxul › renderer › pane 2', status: '◆ Needs you', color: '#f2b66d', output: "I'd like to run the Metal tests.\n\nAllow this command? (y/n)" },
    badger: { route: 'Website › deck › pane 1', status: '✓ Done', color: '#58a6ff', output: 'Rendered the slides and checked the links.\n\nAnything else?' },
    moth: { route: 'Draxul › windows › pane 3', status: 'Exited', color: '#8b949e', output: 'The process has exited.\n\nRestart it from the palette, or with draxul agent restart.' }
  };
  document.querySelectorAll('[data-agent]').forEach(button => {
    button.addEventListener('click', () => {
      const example = examples[button.dataset.agent];
      document.querySelectorAll('[data-agent]').forEach(row => {
        const selected = row === button;
        row.classList.toggle('active', selected);
        row.setAttribute('aria-pressed', String(selected));
      });
      document.getElementById('agent-route').textContent = example.route;
      document.getElementById('agent-status').textContent = example.status;
      document.getElementById('agent-status').style.color = example.color;
      document.getElementById('agent-output').textContent = example.output;
    });
  });
})();
</script>
