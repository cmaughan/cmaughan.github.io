<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Draxul commands find agents, give them work, wait for their state, and read their terminal output"><title>Draxul commands find agents, give them work, wait for their state, and read their terminal output</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="20" y="35" width="280" height="278" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="160" y="83" font-size="30" fill="#58a6ff" text-anchor="middle" font-weight="600">Find an agent</text><text x="42" y="141" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="600">agent list</text><text x="42" y="175" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Who is here?</text><text x="42" y="233" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="600">agent get</text><text x="42" y="267" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">What are they doing?</text><rect x="360" y="35" width="280" height="278" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="500" y="83" font-size="30" fill="#7ee787" text-anchor="middle" font-weight="600">Give it work</text><text x="382" y="141" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="600">agent start</text><text x="382" y="175" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Launch an agent</text><text x="382" y="233" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="600">agent prompt</text><text x="382" y="267" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Send a task + Enter</text><rect x="700" y="35" width="280" height="278" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="840" y="83" font-size="30" fill="#f2b66d" text-anchor="middle" font-weight="600">Follow along</text><text x="722" y="141" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="600">agent wait</text><text x="722" y="175" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Wait for a chosen state</text><text x="722" y="233" font-size="28" fill="#e6edf3" text-anchor="start" font-weight="600">pane read</text><text x="722" y="267" font-size="22" fill="#a4b3c4" text-anchor="start" font-weight="400">Read its terminal text</text><path d="M310,171 L346,171" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><path d="M650,171 L686,171" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><text x="500" y="358" font-size="22" fill="#a4b3c4" text-anchor="middle" font-weight="400">CLI example</text><text x="500" y="405" font-size="29" fill="#7ee787" text-anchor="middle" font-weight="500">draxul agent prompt &lt;id&gt; --text "Run the tests"</text></g></svg>