<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="A returning window asks to reconnect; the server sends the current screen and then subsequent changes"><title>A returning window asks to reconnect; the server sends the current screen and then subsequent changes</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="130" y="50" font-size="36" fill="#7ee787" text-anchor="middle" font-weight="600">Server</text><text x="860" y="50" font-size="36" fill="#58a6ff" text-anchor="middle" font-weight="600">Your window</text><path d="M130,83 L130,384" fill="none" stroke="#7ee787" stroke-width="3" /><path d="M860,83 L860,384" fill="none" stroke="#58a6ff" stroke-width="3" /><path d="M845,137 L145,137" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><rect x="285" y="92" width="430" height="42" rx="0" fill="#0d1117" stroke="#0d1117" stroke-width="2"/><text x="500" y="125" font-size="32" fill="#58a6ff" text-anchor="middle" font-weight="400">I’m back.</text><path d="M145,245 L845,245" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)" /><rect x="285" y="200" width="430" height="42" rx="0" fill="#0d1117" stroke="#0d1117" stroke-width="2"/><text x="500" y="233" font-size="32" fill="#7ee787" text-anchor="middle" font-weight="400">Here’s the screen.</text><path d="M145,353 L845,353" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)" /><rect x="285" y="308" width="430" height="42" rx="0" fill="#0d1117" stroke="#0d1117" stroke-width="2"/><text x="500" y="341" font-size="32" fill="#7ee787" text-anchor="middle" font-weight="400">Here’s what changed.</text></g></svg>