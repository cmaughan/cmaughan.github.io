t-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="20" y="145" width="250" height="142" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="145" y="203" font-size="34" fill="#7ee787" text-anchor="middle" font-weight="600">Your app</text><text x="145" y="246" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">Sends output</text><path d="M287,216 L354,216" fill="none" stroke="#f2b66d" stroke-width="2.5" marker-end="url(#gold)" /><rect x="375" y="145" width="250" height="142" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="500" y="203" font-size="34" fill="#f2b66d" text-anchor="middle" font-weight="600">tmux</text><text x="500" y="246" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">Arranges the panes</text><path d="M641,216 L710,216" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><rect x="730" y="145" width="250" height="142" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="855" y="203" font-size="34" fill="#58a6ff" text-anchor="middle" font-weight="600">Draxul</text><text x="855" y="246" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">Draws the window</text></g></svg>