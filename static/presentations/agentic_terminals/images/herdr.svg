<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Herdr shows which agents are working, need your help, or have finished"><title>Herdr shows which agents are working, need your help, or have finished</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="45" y="50" font-size="42" fill="#7ee787" text-anchor="start" font-weight="600">Herdr</text><text x="45" y="97" font-size="32" fill="#e6edf3" text-anchor="start" font-weight="400">Runs and tracks your agents</text><rect x="45" y="153" width="485" height="70" rx="10" fill="#161e29" stroke="#33465a" stroke-width="2"/><text x="76" y="199" font-size="32" fill="#7ee787" text-anchor="start" font-weight="400">● Working</text><rect x="45" y="243" width="485" height="70" rx="10" fill="#34291d" stroke="#f2b66d" stroke-width="2"/><text x="76" y="289" font-size="32" fill="#f2b66d" text-anchor="start" font-weight="400">◆ Needs you</text><rect x="45" y="333" width="485" height="70" rx="10" fill="#161e29" stroke="#33465a" stroke-width="2"/><text x="76" y="379" font-size="32" fill="#58a6ff" text-anchor="start" font-weight="400">✓ Finished</text><path d="M548,278 L631,278" fill="none" stroke="#f2b66d" stroke-width="2.5" marker-end="url(#gold)" /><text x="815" y="261" font-size="36" fill="#e6edf3" text-anchor="middle" font-weight="400">Know where</text><text x="815" y="309.6" font-size="36" fill="#e6edf3" text-anchor="middle" font-weight="400">to look next.</text></g></svg>