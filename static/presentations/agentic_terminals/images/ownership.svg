<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Draxul moved work out of a single window into a server; windows show the work independently"><title>Draxul moved work out of a single window into a server; windows show the work independently</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="166" y="65" font-size="34" fill="#a4b3c4" text-anchor="middle" font-weight="400">Before</text><rect x="25" y="147" width="280" height="142" rx="10" fill="#161e29" stroke="#a4b3c4" stroke-width="2"/><text x="165" y="205" font-size="34" fill="#a4b3c4" text-anchor="middle" font-weight="600">One window</text><text x="165" y="248" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">Owns all the work</text><path d="M324,218 L404,218" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><text x="711" y="65" font-size="34" fill="#7ee787" text-anchor="middle" font-weight="400">Now</text><rect x="435" y="109" width="265" height="142" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="567.5" y="167" font-size="34" fill="#7ee787" text-anchor="middle" font-weight="600">Server</text><text x="567.5" y="210" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">Keeps work running</text><rect x="722" y="250" width="265" height="142" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="854.5" y="308" font-size="34" fill="#58a6ff" text-anchor="middle" font-weight="600">Windows</text><text x="854.5" y="351" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">Show the work</text><path d="M710,179 H855 V235" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)"/></g></svg>