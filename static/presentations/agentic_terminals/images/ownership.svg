<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 155" role="img" aria-label="Before: one window owns every shell. Now: a server owns shells, state and agents, and windows attach to it"><title>Before and after the client/server port</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="20" y="40" font-size="24" fill="#a4b3c4" text-anchor="start" font-weight="600">Before</text><rect x="20" y="58" width="250" height="74" rx="10" fill="#161e29" stroke="#a4b3c4" stroke-width="2"/><text x="145" y="92" font-size="24" fill="#e6edf3" text-anchor="middle" font-weight="600">One window</text><text x="145" y="120" font-size="19" fill="#a4b3c4" text-anchor="middle" font-weight="400">owns every shell</text><path d="M285,95 L338,95" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><text x="352" y="40" font-size="24" fill="#7ee787" text-anchor="start" font-weight="600">Now</text><rect x="352" y="58" width="262" height="74" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="483" y="92" font-size="24" fill="#7ee787" text-anchor="middle" font-weight="600">Server</text><text x="483" y="120" font-size="19" fill="#a4b3c4" text-anchor="middle" font-weight="400">owns shells, state, agents</text><path d="M622,80 H686" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-start="url(#blue)" marker-end="url(#blue)"/><path d="M622,112 H686" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-start="url(#blue)" marker-end="url(#blue)"/><rect x="694" y="50" width="300" height="44" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="844" y="79" font-size="18" fill="#e6edf3" text-anchor="middle" font-weight="400">Window: draws, sends keys</text><rect x="694" y="100" width="300" height="44" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="844" y="129" font-size="18" fill="#e6edf3" text-anchor="middle" font-weight="400">Another window, same session</text></g></svg>