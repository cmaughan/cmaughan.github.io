<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Read text, choose its letter shape from a font, and draw it in a terminal cell"><title>Read text, choose its letter shape from a font, and draw it in a terminal cell</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><text x="160" y="70" font-size="34" fill="#7ee787" text-anchor="middle" font-weight="600">Read the text</text><text x="160" y="113" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">e + an accent</text><text x="160" y="250" font-size="66" fill="#7ee787" text-anchor="middle" font-weight="400">e + ◌́</text><path d="M320,220 L370,220" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><text x="505" y="70" font-size="34" fill="#58a6ff" text-anchor="middle" font-weight="600">Find the shape</text><text x="505" y="113" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">From a font</text><text x="505" y="278" font-size="155" fill="#58a6ff" text-anchor="middle" font-weight="400">é</text><path d="M640,220 L695,220" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><text x="850" y="70" font-size="34" fill="#c4a5ff" text-anchor="middle" font-weight="600">Draw the letter</text><text x="850" y="113" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">In its screen cell</text><rect x="773" y="155" width="154" height="154" rx="0" fill="#161e29" stroke="#33465a" stroke-width="2"/><text x="850" y="268.96" font-size="103.18" fill="#e6edf3" text-anchor="middle" font-weight="500">é</text></g></svg>