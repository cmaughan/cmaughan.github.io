<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="You ask an agent in plain words; a skill tells it which draxul commands to run; the panes appear"><title>You ask an agent in plain words; a skill tells it which draxul commands to run; the panes appear</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="25" y="60" width="290" height="200" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="170" y="108" font-size="30" fill="#7ee787" text-anchor="middle" font-weight="600">You ask</text><text x="170" y="160" font-size="23" fill="#e6edf3" text-anchor="middle" font-weight="400">“Make a tab with the</text><text x="170" y="191.05" font-size="23" fill="#e6edf3" text-anchor="middle" font-weight="400">build, the tests and</text><text x="170" y="222.1" font-size="23" fill="#e6edf3" text-anchor="middle" font-weight="400">a reviewer agent.”</text><path d="M330,160 L385,160" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><rect x="400" y="60" width="250" height="200" rx="10" fill="#161e29" stroke="#c4a5ff" stroke-width="2"/><text x="525" y="108" font-size="30" fill="#c4a5ff" text-anchor="middle" font-weight="600">Skill</text><text x="525" y="160" font-size="23" fill="#a4b3c4" text-anchor="middle" font-weight="400">Tells the agent</text><text x="525" y="191.05" font-size="23" fill="#a4b3c4" text-anchor="middle" font-weight="400">which draxul</text><text x="525" y="222.1" font-size="23" fill="#a4b3c4" text-anchor="middle" font-weight="400">commands to use</text><path d="M665,160 L720,160" fill="none" stroke="#33465a" stroke-width="2.5" marker-end="url(#line)" /><text x="855" y="45" font-size="30" fill="#58a6ff" text-anchor="middle" font-weight="600">Draxul</text><rect x="735" y="70" width="120" height="190" rx="0" fill="#1c4432" stroke="#7ee787" stroke-width="2"/><rect x="855" y="70" width="120" height="95" rx="0" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><rect x="855" y="165" width="120" height="95" rx="0" fill="#34291d" stroke="#f2b66d" stroke-width="2"/><text x="795" y="172" font-size="23" fill="#7ee787" text-anchor="middle" font-weight="400">build</text><text x="915" y="125" font-size="23" fill="#58a6ff" text-anchor="middle" font-weight="400">tests</text><text x="915" y="220" font-size="23" fill="#f2b66d" text-anchor="middle" font-weight="400">review</text><text x="500" y="330" font-size="27" fill="#a4b3c4" text-anchor="middle" font-weight="400">draxul layout apply  ·  pane run  ·  agent start</text></g></svg>