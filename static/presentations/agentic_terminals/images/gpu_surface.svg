<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Draxul owns one GPU frame on Metal or Vulkan; terminals, Neovim and plugins each record into the shared command buffer inside their pane"><title>Draxul owns one GPU frame on Metal or Vulkan; terminals, Neovim and plugins each record into the shared command buffer inside their pane</title><defs><marker id="bg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0d1117"/></marker><marker id="panel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#161e29"/></marker><marker id="line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#33465a"/></marker><marker id="text" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#e6edf3"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a4b3c4"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#58a6ff"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7ee787"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f2b66d"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#c4a5ff"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ff8989"/></marker></defs><g font-family="Inter, Helvetica Neue, Arial, sans-serif"><rect x="20" y="20" width="960" height="92" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="44" y="58" font-size="30" fill="#58a6ff" text-anchor="start" font-weight="600">One frame</text><text x="44" y="92" font-size="21" fill="#a4b3c4" text-anchor="start" font-weight="400">Draxul owns the window, swapchain, command buffer and present</text><rect x="760" y="40" width="200" height="30" rx="6" fill="#0d1117" stroke="#33465a" stroke-width="2"/><text x="860" y="61" font-size="18" fill="#e6edf3" text-anchor="middle" font-weight="400">Metal · macOS</text><rect x="760" y="76" width="200" height="30" rx="6" fill="#0d1117" stroke="#33465a" stroke-width="2"/><text x="860" y="97" font-size="18" fill="#e6edf3" text-anchor="middle" font-weight="400">Vulkan · Windows</text><rect x="20" y="170" width="225" height="110" rx="10" fill="#161e29" stroke="#58a6ff" stroke-width="2"/><text x="132" y="214" font-size="26" fill="#58a6ff" text-anchor="middle" font-weight="600">Terminal</text><text x="132" y="248" font-size="18" fill="#a4b3c4" text-anchor="middle" font-weight="400">grid + glyph atlas</text><path d="M132,166 L132,118" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#blue)" /><rect x="265" y="170" width="225" height="110" rx="10" fill="#161e29" stroke="#c4a5ff" stroke-width="2"/><text x="377" y="214" font-size="26" fill="#c4a5ff" text-anchor="middle" font-weight="600">Neovim</text><text x="377" y="248" font-size="18" fill="#a4b3c4" text-anchor="middle" font-weight="400">grid + glyph atlas</text><path d="M377,166 L377,118" fill="none" stroke="#c4a5ff" stroke-width="2.5" marker-end="url(#purple)" /><rect x="510" y="170" width="225" height="110" rx="10" fill="#161e29" stroke="#7ee787" stroke-width="2"/><text x="622" y="214" font-size="26" fill="#7ee787" text-anchor="middle" font-weight="600">SatView</text><text x="622" y="248" font-size="18" fill="#a4b3c4" text-anchor="middle" font-weight="400">plugin: 3D, ImGui</text><path d="M622,166 L622,118" fill="none" stroke="#7ee787" stroke-width="2.5" marker-end="url(#green)" /><rect x="755" y="170" width="225" height="110" rx="10" fill="#161e29" stroke="#f2b66d" stroke-width="2"/><text x="867" y="214" font-size="26" fill="#f2b66d" text-anchor="middle" font-weight="600">Rezonality</text><text x="867" y="248" font-size="18" fill="#a4b3c4" text-anchor="middle" font-weight="400">plugin: passes, ray tracing</text><path d="M867,166 L867,118" fill="none" stroke="#f2b66d" stroke-width="2.5" marker-end="url(#gold)" /><text x="500" y="308" font-size="18" fill="#a4b3c4" text-anchor="middle" font-weight="400">Each pane records into the same command buffer, inside its own rectangle</text><text x="500" y="350" font-size="22" fill="#e6edf3" text-anchor="middle" font-weight="600">Plugin C ABI v2</text><rect x="40" y="366" width="290" height="50" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="2"/><text x="185" y="398" font-size="20" fill="#7ee787" text-anchor="middle" font-weight="400">Borrowed command buffer</text><rect x="355" y="366" width="290" height="50" rx="8" fill="#0d1117" stroke="#f2b66d" stroke-width="2"/><text x="500" y="398" font-size="20" fill="#f2b66d" text-anchor="middle" font-weight="400">Never submits or presents</text><rect x="670" y="366" width="290" height="50" rx="8" fill="#0d1117" stroke="#c4a5ff" stroke-width="2"/><text x="815" y="398" font-size="20" fill="#c4a5ff" text-anchor="middle" font-weight="400">Hot reload, with rollback</text></g></svg>