<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  {{/* The home page only redirects, but link unfurlers (Slack, iMessage,
       social sites) read it without following the refresh, so it carries
       the same share tags as a real page. */}}
  {{ range site.Params.navlinks }}
    {{ if .home }}
  <meta http-equiv="refresh" content="0; URL={{ .url | absURL }}">
  <link rel="canonical" href="{{ .url | absURL }}">
    {{ end }}
  {{ end }}
  <title>{{ site.Title }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <meta property="og:site_name" content="{{ site.Title }}">
  <meta property="og:title" content="{{ site.Title }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ site.Title }}">
  <meta name="twitter:description" content="{{ site.Params.description }}">
  {{ partial "share_image.html" . }}
  <link rel="shortcut icon" href="{{ "img/favicon.png" | absURL }}">
</head>
<body></body>
</html>
