<video class="img-responsive" controls playsinline preload="metadata"{{ with .Get "poster" }} poster="{{ . | relURL }}"{{ end }} aria-label="{{ .Get "title" }}">
  <source src="{{ .Get "src" | relURL }}" type="video/mp4">
  Your browser does not support embedded video. <a href="{{ .Get "src" | relURL }}">Download the video</a> instead.
</video>
